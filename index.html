<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slatefall Prep</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
.sec-btn.active{background:#0d6efd;color:white;}
.choice{cursor:pointer;}
.choice.selected{background:#cfe2ff;}
.choice.correct{background:#d1e7dd;}
.choice.wrong{background:#f8d7da;}
</style>
</head>
<body class="bg-light">
<div class="container py-4" style="max-width:700px">
  <h5 class="mb-1">Slatefall Prep System</h5>
  <p class="text-muted small mb-3">Adaptive MCQ from SLATEFALL dossier</p>
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><a class="nav-link active" onclick="show_page('start',this)">New Session</a></li>
    <li class="nav-item"><a class="nav-link" onclick="show_page('quiz',this)">Quiz</a></li>
    <li class="nav-item"><a class="nav-link" onclick="show_page('results',this)">Results</a></li>
    <li class="nav-item"><a class="nav-link" onclick="show_page('history',this)">History</a></li>
  </ul>
  <div id="start">
    <div class="card p-3 mb-3">
      <p class="fw-bold mb-2">Select sections</p>
      <div id="sec-grid" class="d-flex flex-wrap gap-2 mb-3"></div>
      <div class="d-flex align-items-center gap-2 mb-2">
        <label class="small">Questions per section</label>
        <select id="n-per" class="form-select form-select-sm w-auto">
          <option>3</option><option selected>5</option><option>7</option><option>10</option>
        </select>
      </div>
      <div id="weak-info"></div>
      <button class="btn btn-primary btn-sm w-100" onclick="start_session()">Generate Questions</button>
    </div>
  </div>
  <div id="quiz" class="d-none">
    <div id="quiz-content"></div>
    <button id="sub-btn" class="btn btn-success btn-sm w-100 d-none mt-2" onclick="submit_answers()">Submit Answers</button>
  </div>
  <div id="results" class="d-none">
    <div id="results-content"></div>
  </div>
  <div id="history" class="d-none">
    <div class="card p-3">
      <p class="fw-bold mb-2">Past Sessions</p>
      <div id="history-content"></div>
    </div>
  </div>
</div>
<script>
const API="http://127.0.0.1:8000"
let current_questions=[]
let selected_sections=[]

function show_page(id,el){
  ["start","quiz","results","history"].forEach(p=>document.getElementById(p).classList.add("d-none"))
  document.querySelectorAll(".nav-link").forEach(l=>l.classList.remove("active"))
  document.getElementById(id).classList.remove("d-none")
  if(el)el.classList.add("active")
  if(id==="history")load_history()
}

async function load_sections(){
  try{
    const res=await fetch(`${API}/sections`)
    const data=await res.json()
    const grid=document.getElementById("sec-grid")
    data.sections.forEach(s=>{
      const btn=document.createElement("button")
      btn.className="btn btn-outline-secondary btn-sm sec-btn"
      btn.textContent=`Section ${s.section_id}`
      btn.title=s.title
      btn.onclick=()=>{
        btn.classList.toggle("active")
        btn.classList.toggle("btn-outline-secondary")
        btn.classList.toggle("btn-primary")
        update_selected()
      }
      grid.appendChild(btn)
    })
  }catch(e){
    document.getElementById("sec-grid").innerHTML=`<span class="text-danger small">Server not running</span>`
  }
}

function update_selected(){
  selected_sections=[]
  document.querySelectorAll(".sec-btn.active").forEach(b=>{
    selected_sections.push(parseInt(b.textContent.replace("Section ","")))
  })
  load_weak_info()
}

async function load_weak_info(){
  if(!selected_sections.length){document.getElementById("weak-info").innerHTML="";return}
  try{
    const params=selected_sections.map(s=>`section_ids=${s}`).join("&")
    const res=await fetch(`${API}/weak-topics?${params}`)
    const data=await res.json()
    document.getElementById("weak-info").innerHTML=data.weak_topics.length>0
      ?`<div class="alert alert-info py-1 small mb-2">Found ${data.weak_topics.length} weak area(s) — questions will focus on these</div>`
      :""
  }catch(e){}
}

async function start_session(){
  if(!selected_sections.length){alert("Select at least one section");return}
  const n=parseInt(document.getElementById("n-per").value)
  show_page("quiz",null)
  document.getElementById("quiz-content").innerHTML=`<p class="text-muted small">Generating questions...</p>`
  document.getElementById("sub-btn").classList.add("d-none")
  try{
    const res=await fetch(`${API}/start-session`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({section_ids:selected_sections,n_per_section:n})
    })
    const data=await res.json()
    if(data.detail){document.getElementById("quiz-content").innerHTML=`<p class="text-danger">${data.detail}</p>`;return}
    current_questions=data.questions
    render_quiz(data)
  }catch(e){
    document.getElementById("quiz-content").innerHTML=`<p class="text-danger small">Request failed. Is server running?</p>`
  }
}

function render_quiz(data){
  const c=document.getElementById("quiz-content")
  c.innerHTML=data.weak_topics_found>0
    ?`<div class="alert alert-info py-1 small mb-2">Adaptive mode: focusing on ${data.weak_topics_found} weak area(s)</div>`
    :""
  data.questions.forEach((q,i)=>{
    const d=document.createElement("div")
    d.className="card p-3 mb-2"
    d.innerHTML=`
      <p class="text-muted small mb-1">Q${i+1} — Section ${q.section_id}</p>
      <p class="small fw-bold mb-2">${q.question}</p>
      <div class="choices"></div>
    `
    q.choices.forEach(choice=>{
      const choice_el=document.createElement("div")
      choice_el.className="choice border rounded px-2 py-1 mb-1 small"
      choice_el.textContent=choice
      choice_el.onclick=()=>select_answer(i,choice_el,choice)
      d.querySelector(".choices").appendChild(choice_el)
    })
    c.appendChild(d)
  })
  document.getElementById("sub-btn").classList.remove("d-none")
}

function select_answer(i,el,ans){
  el.closest(".card").querySelectorAll(".choice").forEach(c=>{
    c.classList.remove("selected","correct","wrong")
  })
  current_questions[i].user_answer=ans
  const correct=current_questions[i].correct_answer
  el.closest(".card").querySelectorAll(".choice").forEach(c=>{
    if(c.textContent.trim()===correct){
      c.classList.add("correct")
    }
  })
  if(ans!==correct){
    el.classList.add("wrong")
  }
}

async function submit_answers(){
  const unanswered=current_questions.filter(q=>!q.user_answer||q.user_answer==="")
  if(unanswered.length){alert(`${unanswered.length} question(s) unanswered`);return}
  try{
    const res=await fetch(`${API}/submit-answers`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({session_id:0,answers:current_questions})
    })
    const data=await res.json()
    render_results(data)
    show_page("results",null)
  }catch(e){alert("Submission failed")}
}

function render_results(data){
  const total=current_questions.length
  const correct=parseInt(data.score.split("/")[0])
  let wrong_html=data.wrong_answers.length>0
    ?data.wrong_answers.map(w=>`
      <div class="border border-danger rounded p-2 mb-2 small">
        <p class="mb-1 fw-bold">${w.question}</p>
        <p class="mb-0 text-danger">Your answer: ${w.your_answer}</p>
        <p class="mb-0 text-success">Correct: ${w.correct_answer}</p>
        <p class="mb-0 text-muted fst-italic">${w.explanation}</p>
      </div>`).join("")
    :`<div class="alert alert-success py-1 small">Perfect score!</div>`
  document.getElementById("results-content").innerHTML=`
    <div class="card p-3 mb-3">
      <p class="fw-bold mb-2">Session #${data.session_id} Results</p>
      <div class="d-flex gap-2 mb-3">
        <div class="flex-fill text-center bg-light rounded p-2"><div class="fs-5 fw-bold">${correct}</div><div class="small text-muted">Correct</div></div>
        <div class="flex-fill text-center bg-light rounded p-2"><div class="fs-5 fw-bold">${total-correct}</div><div class="small text-muted">Wrong</div></div>
        <div class="flex-fill text-center bg-light rounded p-2"><div class="fs-5 fw-bold">${data.percentage}%</div><div class="small text-muted">Score</div></div>
      </div>
      ${wrong_html}
      <button class="btn btn-primary btn-sm w-100 mt-2" onclick="show_page('start',null)">New Session</button>
    </div>`
}

async function load_history(){
  try{
    const res=await fetch(`${API}/history`)
    const data=await res.json()
    const el=document.getElementById("history-content")
    if(!data.sessions.length){el.innerHTML=`<p class="text-muted small">No sessions yet</p>`;return}
    el.innerHTML=data.sessions.map(s=>{
      const pct=s.total_questions>0?Math.round((s.correct_count/s.total_questions)*100):0
      const badge=pct>=80?"success":pct>=50?"warning":"danger"
      return`<div class="d-flex justify-content-between align-items-center border-bottom py-2">
        <div>
          <p class="mb-0 small fw-bold">Sections: ${s.sections.join(", ")}</p>
          <p class="mb-0 small text-muted">${s.total_questions} questions · ${new Date(s.created_at).toLocaleString()}</p>
        </div>
        <span class="badge bg-${badge}">${pct}%</span>
      </div>`
    }).join("")
  }catch(e){
    document.getElementById("history-content").innerHTML=`<p class="text-danger small">Could not load history</p>`
  }
}

load_sections()
</script>
</body>
</html>
